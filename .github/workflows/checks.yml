name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: bon_voyage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BON_VOYAGE_TEST_POSTGRES_URL: postgresql://postgres:test-password@localhost:5432/bon_voyage_test
      BON_VOYAGE_DB: /tmp/bon-voyage-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: npm run test:frontend
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start isolated test server
        run: |
          python -m uvicorn backend.main:app --port 8001 > "$RUNNER_TEMP/bon-voyage-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/api/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/bon-voyage-server.log"
          exit 1
      - run: npm run test:browser
      - run: npm run test:planner
      - run: npm run test:intro
      - run: npm run test:dialogs
